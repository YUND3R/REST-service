name: Build and test (CPU-test)

on:
  push:
    branches: [CPU-test]
    paths:
      - "api-request-gateway/**"
      - "deploy/k8s/**"
      - "libs/**"
      - ".github/workflows/cpu-test.yml"
  pull_request:
    branches: [CPU-test]
    paths:
      - "api-request-gateway/**"
      - "deploy/k8s/**"
      - "libs/**"
      - ".github/workflows/cpu-test.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Kubernetes after build"
        type: boolean
        default: false
      edge_overlay:
        description: "Edge overlay (cpu-test = all on Edge, edge = cross-cluster API)"
        type: choice
        options:
          - cpu-test
          - edge
        default: cpu-test
      ml_overlay:
        description: "ML overlay (skip deploy-ml when cpu-test edge overlay)"
        type: choice
        options:
          - ml-cpu-internal
          - ml-data-only
          - skip
        default: skip

concurrency:
  group: cpu-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  KUSTOMIZE_LOAD: LoadRestrictionsNone
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-request-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.3"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Ruff
        run: uv run ruff check gateway workers models db tests

      - name: Ruff (shared libs)
        run: uv run ruff check ../libs/edu_ml_common/edu_ml --target-version py312 --line-length 120

      - name: Unit tests
        run: uv run pytest -q --tb=short

      - name: Byte-compile
        run: uv run python -m compileall -q gateway workers models db tests

  kustomize:
    name: Validate K8s manifests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.2"

      - name: kustomize build (cpu-test / edge-with-data)
        run: kubectl kustomize --load-restrictor="${KUSTOMIZE_LOAD}" deploy/k8s/clusters/cpu-test

      - name: kustomize build (edge cross-cluster)
        run: kubectl kustomize --load-restrictor="${KUSTOMIZE_LOAD}" deploy/k8s/clusters/edge

      - name: kustomize build (ml-cpu-internal)
        run: kubectl kustomize --load-restrictor="${KUSTOMIZE_LOAD}" deploy/k8s/clusters/ml-cpu-internal

      - name: kustomize build (ml-data-only)
        run: kubectl kustomize --load-restrictor="${KUSTOMIZE_LOAD}" deploy/k8s/clusters/ml-data-only

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [quality, kustomize]
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.img.outputs.full }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image coordinates
        id: img
        shell: bash
        run: |
          r="${GITHUB_REPOSITORY,,}"
          echo "full=${REGISTRY}/${r}" >> "$GITHUB_OUTPUT"

      - name: Image tag
        id: tag
        run: echo "tag=cpu-test-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api-request-gateway
          file: api-request-gateway/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.full }}:cpu-test
            ${{ steps.img.outputs.full }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-ml:
    name: Deploy ML cluster
    runs-on: ubuntu-latest
    needs: docker
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy &&
      inputs.ml_overlay != 'skip'
    environment:
      name: k8s-ml-cpu-test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.2"

      - name: Kubeconfig (ML)
        env:
          KUBE: ${{ secrets.KUBECONFIG_ML }}
        run: |
          mkdir -p ~/.kube
          if [ -z "$KUBE" ]; then
            echo "::warning::KUBECONFIG_ML not set — skip ML deploy"
            exit 0
          fi
          printf '%s\n' "$KUBE" > ~/.kube/config

      - name: Resolve ML overlay
        id: ml
        env:
          INPUT: ${{ github.event.inputs.ml_overlay }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT" ] && [ "$INPUT" != "skip" ]; then
            echo "path=deploy/k8s/clusters/${INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "path=deploy/k8s/clusters/ml-cpu-internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply app secrets (ML)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
        run: |
          if [ ! -s ~/.kube/config ]; then exit 0; fi
          if [ -z "${POSTGRES_PASSWORD:-}" ] || [ -z "${WEBHOOK_SIGNING_SECRET:-}" ]; then
            echo "::warning::POSTGRES_PASSWORD or WEBHOOK_SIGNING_SECRET not set — skip app secrets"
            exit 0
          fi
          db_url="postgresql+asyncpg://ai_mentor:${POSTGRES_PASSWORD}@postgres:5432/ai_mentor"
          kubectl create namespace edu-ml --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n edu-ml create secret generic postgres-secrets \
            --from-literal=password="${POSTGRES_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n edu-ml create secret generic gateway-secrets \
            --from-literal=database-url="${db_url}" \
            --from-literal=webhook-signing-secret="${WEBHOOK_SIGNING_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ML manifests
        env:
          IMAGE: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
          ML_OVERLAY: ${{ steps.ml.outputs.path }}
        run: |
          if [ ! -s ~/.kube/config ]; then exit 0; fi
          set -euo pipefail
          kubectl kustomize --load-restrictor="${KUSTOMIZE_LOAD}" "$ML_OVERLAY" \
            | sed "s|ghcr.io/yund3r/rest-service:latest|${IMAGE}|g" \
            | sed "s|ghcr.io/yund3r/rest-service:cpu-test|${IMAGE}|g" \
            | sed "s|image: api-request-gateway:latest|image: ${IMAGE}|g" \
            | kubectl apply -f -

      - name: Wait for ML rollouts
        continue-on-error: true
        run: |
          if [ ! -s ~/.kube/config ]; then exit 0; fi
          kubectl -n edu-ml rollout status deployment/redis --timeout=180s || true
          kubectl -n edu-ml rollout status deployment/postgres --timeout=180s || true
          kubectl -n edu-ml rollout status deployment/worker-mock --timeout=180s || true

  deploy-edge:
    name: Deploy Edge cluster
    runs-on: ubuntu-latest
    needs: [docker, deploy-ml]
    if: |
      always() &&
      needs.docker.result == 'success' &&
      (needs.deploy-ml.result == 'success' || needs.deploy-ml.result == 'skipped') &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy
    environment:
      name: k8s-edge-cpu-test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.2"

      - name: Kubeconfig (Edge)
        env:
          KUBE: ${{ secrets.KUBECONFIG_EDGE }}
        run: |
          mkdir -p ~/.kube
          if [ -z "$KUBE" ]; then
            echo "::warning::KUBECONFIG_EDGE not set — skip Edge deploy"
            exit 0
          fi
          printf '%s\n' "$KUBE" > ~/.kube/config

      - name: Resolve Edge overlay
        id: edge
        env:
          INPUT: ${{ github.event.inputs.edge_overlay }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT" ]; then
            echo "path=deploy/k8s/clusters/${INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "path=deploy/k8s/clusters/cpu-test" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply app secrets (Edge)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
        run: |
          if [ ! -s ~/.kube/config ]; then exit 0; fi
          if [ -z "${POSTGRES_PASSWORD:-}" ] || [ -z "${WEBHOOK_SIGNING_SECRET:-}" ]; then
            echo "::warning::POSTGRES_PASSWORD or WEBHOOK_SIGNING_SECRET not set — skip app secrets"
            exit 0
          fi
          db_url="postgresql+asyncpg://ai_mentor:${POSTGRES_PASSWORD}@postgres:5432/ai_mentor"
          kubectl create namespace edu-ml --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n edu-ml create secret generic postgres-secrets \
            --from-literal=password="${POSTGRES_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n edu-ml create secret generic gateway-secrets \
            --from-literal=database-url="${db_url}" \
            --from-literal=webhook-signing-secret="${WEBHOOK_SIGNING_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Edge manifests
        env:
          IMAGE: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
          EDGE_OVERLAY: ${{ steps.edge.outputs.path }}
          ML_NODE_HOST: ${{ secrets.ML_NODE_HOST }}
        run: |
          if [ ! -s ~/.kube/config ]; then exit 0; fi
          set -euo pipefail
          rendered="$(kubectl kustomize --load-restrictor="${KUSTOMIZE_LOAD}" "$EDGE_OVERLAY")"
          rendered="$(printf '%s\n' "$rendered" \
            | sed "s|ghcr.io/yund3r/rest-service:latest|${IMAGE}|g" \
            | sed "s|image: api-request-gateway:latest|image: ${IMAGE}|g")"
          if [ -n "${ML_NODE_HOST:-}" ] && [ "$EDGE_OVERLAY" = "deploy/k8s/clusters/edge" ]; then
            rendered="$(printf '%s\n' "$rendered" | sed "s|ip: 0.0.0.0|ip: ${ML_NODE_HOST}|g")"
            rendered="$(printf '%s\n' "$rendered" | sed "s|ip: 127.0.0.1|ip: ${ML_NODE_HOST}|g")"
          fi
          printf '%s\n' "$rendered" | kubectl apply -f -

      - name: Wait for Edge rollouts
        continue-on-error: true
        run: |
          if [ ! -s ~/.kube/config ]; then exit 0; fi
          kubectl -n edu-ml rollout status deployment/gateway --timeout=300s || true
          kubectl -n edu-ml rollout status deployment/edge-balancer --timeout=120s || true
          kubectl -n edu-ml rollout status deployment/worker-mock --timeout=120s || true
