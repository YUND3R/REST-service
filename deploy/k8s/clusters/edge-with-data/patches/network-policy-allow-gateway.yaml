apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress-private-only
spec:
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - worker-analyze
                  - worker-generate
                  - worker-pipeline
                  - worker-mock
                  - gateway
                  - webhook-dispatcher
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-private-only
spec:
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - worker-analyze
                  - worker-generate
                  - worker-pipeline
                  - worker-mock
                  - gateway
                  - webhook-dispatcher
      ports:
        - protocol: TCP
          port: 5432
