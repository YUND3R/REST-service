apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edu-ml-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - INGRESS_HOST
      secretName: edu-ml-tls-le
  rules:
    - host: INGRESS_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-balancer
                port:
                  number: 80
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-balancer
                port:
                  number: 80
